<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:#0b1f3b;font-family:'Bricolage Grotesque',sans-serif;position:relative}
.glow{position:absolute;inset:0;background:
 radial-gradient(900px 700px at 540px 1250px, rgba(46,125,255,.32), transparent 70%),
 radial-gradient(600px 380px at 860px 120px, rgba(245,180,80,.16), transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(180deg,#000,transparent 45%)}
.head{position:absolute;top:110px;left:80px;right:80px;text-align:center}
h1{margin:0;color:#fff;font-weight:800;font-size:92px;line-height:1;letter-spacing:-.02em;font-variation-settings:'wdth' 80}
h1 span{display:block;background:linear-gradient(90deg,#ffc76b,#f5a83a);-webkit-background-clip:text;color:transparent;padding-bottom:6px}
p{margin:26px auto 0;color:#b9bee0;font-size:36px;line-height:1.3;font-weight:500;max-width:860px;text-wrap:balance}
.phone{position:absolute;left:105px;top:540px;width:870px;border-radius:72px 72px 0 0;padding:14px 14px 0;background:linear-gradient(180deg,#2a3a63,#151d36);box-shadow:0 -10px 80px rgba(46,125,255,.35),0 0 0 2px rgba(255,255,255,.08)}
.phone img{display:block;width:100%;border-radius:60px 60px 0 0}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="head"><h1>{{A}}<span>{{B}}</span></h1><p>{{SUB}}</p></div>
<div class="phone"><img src="{{IMG}}"></div>
</body></html>
