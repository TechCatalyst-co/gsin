<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:2560px;height:1440px;overflow:hidden}
body{background:#0b1f3b;font-family:'Bricolage Grotesque',sans-serif;position:relative}
.glow{position:absolute;inset:0;background:
 radial-gradient(1100px 900px at 1800px 760px, rgba(46,125,255,.30), transparent 70%),
 radial-gradient(800px 500px at 300px 150px, rgba(245,180,80,.13), transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(90deg,#000,transparent 60%)}
.copy{position:absolute;left:150px;top:0;bottom:0;width:{{W}}px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:18px;color:#f5b450;font-weight:700;letter-spacing:.22em;font-size:26px;text-transform:uppercase}
.brand img{width:84px;height:84px;object-fit:contain}
h1{margin:34px 0 0;color:#fff;font-weight:800;font-size:{{HS}}px;line-height:.98;letter-spacing:-.02em;font-variation-settings:'wdth' 80}
h1 span{display:block;background:linear-gradient(90deg,#ffc76b,#f5a83a);-webkit-background-clip:text;color:transparent;padding-bottom:8px}
p{margin:36px 0 0;color:#b9bee0;font-size:44px;line-height:1.3;font-weight:500;text-wrap:balance}
.dots{display:flex;gap:14px;margin-top:48px;align-items:center}
.dots i{width:16px;height:16px;border-radius:50%}
.dots b{color:#8e94bf;font-weight:600;font-size:24px;letter-spacing:.1em;margin-left:10px;text-transform:uppercase}
.phones{position:absolute;right:130px;top:0;bottom:0;display:flex;align-items:center;gap:56px}
.phone{width:{{PW}}px;border-radius:64px;padding:13px;background:linear-gradient(180deg,#2a3a63,#151d36);box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 70px rgba(46,125,255,.25),0 0 0 2px rgba(255,255,255,.08)}
.phone img{display:block;width:100%;border-radius:52px}
.phone.lo{transform:translateY(50px)}.phone.hi{transform:translateY(-50px)}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="copy">
 <div class="brand"><img src="mark.png">Global SI News</div>
 <h1>{{A}}<span>{{B}}</span></h1>
 <p>{{SUB}}</p>
 {{DOTS}}
</div>
<div class="phones">{{PHONES}}</div>
</body></html>
