<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:3840px;height:2560px;overflow:hidden}
body{background:#0b1f3b;font-family:'Bricolage Grotesque',sans-serif;position:relative}
.glow{position:absolute;inset:0;background:
 radial-gradient(3000px 1900px at 50% 100%, rgba(46,125,255,.38), transparent 70%),
 radial-gradient(1400px 700px at 50% 0%, rgba(245,180,80,.14), transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(closest-side at 50% 45%,#000,transparent)}
.head{position:absolute;left:0;right:0;top:230px;text-align:center}
h1{margin:0;color:#fff;font-weight:800;font-size:230px;line-height:1;letter-spacing:-.02em;font-variation-settings:'wdth' 80}
h1 span{background:linear-gradient(90deg,#ffc76b,#f5a83a);-webkit-background-clip:text;color:transparent}
p{margin:40px auto 0;color:#b9bee0;font-size:84px;font-weight:500;max-width:2200px}
.cards{position:absolute;left:50%;top:780px;transform:translateX(-50%);display:flex;align-items:flex-start;gap:90px}
.card{width:960px;border-radius:48px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.5),0 0 90px rgba(46,125,255,.28),0 0 0 3px rgba(255,255,255,.10)}
.card img{display:block;width:100%}
.card.mid{width:1100px;margin-top:-80px}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="head"><h1>The AI news wire, <span>graded.</span></h1><p>Every AI story, grouped by topic and briefed twice a day.</p></div>
<div class="cards">
 <div class="card"><img src="brief.png"></div>
 <div class="card mid"><img src="news.png"></div>
 <div class="card"><img src="watch.png"></div>
</div>
</body></html>
