# Render Blueprint — Singularity Wire API.
# Secrets marked `sync: false` are filled in the Render dashboard after the
# first deploy. JWT_SECRET and API_KEY are generated by Render; copy API_KEY
# into your n8n HTTP Request nodes (header x-api-key).
services:
  - type: web
    name: singularity-wire-api
    runtime: node
    plan: free
    rootDir: server
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: BRAND_NAME
        value: Singularity Wire
      - key: CLIENT_URL          # the Netlify web origin (CORS, Stripe returns, RSS links)
        sync: false
      - key: MONGODB_URI         # must name a database, e.g. …/singularity-wire
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID_PREMIUM
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
