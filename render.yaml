# Render Blueprint — Global Super Intelligence News API.
# Secrets marked `sync: false` are filled in the Render dashboard after the
# first deploy. JWT_SECRET and API_KEY are generated by Render; copy API_KEY
# into your n8n HTTP Request nodes (header x-api-key).
services:
  - type: web
    name: gsin-api
    runtime: node
    plan: free
    rootDir: server
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: BRAND_NAME
        value: Global Super Intelligence News
      - key: CLIENT_URL          # the Netlify web origin (CORS, RSS links)
        sync: false
      - key: MONGODB_URI         # must name a database, e.g. …/gsin
        sync: false
